name: forgeops-g02

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgetasks
      POSTGRES_USER: forgeuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - forgetasks-postgres-data:/var/lib/postgresql/data
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeuser -d forgetasks"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  forgetasks-api:
    image: forgetasks-api:1.0.0
    build:
      context: ./apps/forgetasks-api
      dockerfile: Dockerfile
    container_name: forgeops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Restricted loopback binding prevents exposure across external network interfaces
      - "127.0.0.1:18080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgetasks
      SPRING_DATASOURCE_USERNAME: forgeuser
      SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      MANAGEMENT_PORT: 8080
    secrets:
      - source: db_password
        target: spring.datasource.password
    networks:
      - forgeops-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  forgeops-net:
    name: forgeops-g02-net
    driver: bridge

volumes:
  forgetasks-postgres-data:
    name: forgeops-g02-postgres-data

secrets:
  db_password:
    file: ./secrets/db_password.txt
