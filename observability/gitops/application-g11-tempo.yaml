# ForgeOps G11 — Tempo Application
# Manual sync only; single replica monolithic Tempo with 2Gi local filesystem storage.
# CANDIDATE — NOT APPROVED FOR DEPLOYMENT WITHOUT OPERATOR GATE CONFIRMATION.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: g11-tempo
  namespace: argocd
spec:
  project: forgeops-logging-project

  destination:
    server: https://kubernetes.default.svc
    namespace: forgeops-observability

  sources:
    # Pinned upstream Helm chart
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        skipCrds: true
        skipTests: true
        valueFiles:
          - $values/observability/tempo/values-tempo.yaml

    # Git-managed Helm values
    - repoURL: https://github.com/TM-threemavithana/ForgeOps.git
      targetRevision: master
      ref: values

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
