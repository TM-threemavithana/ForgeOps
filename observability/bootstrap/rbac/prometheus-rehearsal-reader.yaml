# ForgeOps G09 — G08 read-only discovery bootstrap
# Separate ownership; not part of the G09 Application.
# Rehearsal namespace: read-only target discovery.
# Requires separate bootstrap ownership approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: g09-prometheus-rehearsal-reader
  namespace: forgeops-gitops-rehearsal
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: g09-prometheus-rehearsal-reader
  namespace: forgeops-gitops-rehearsal
subjects:
  - kind: ServiceAccount
    name: g09-monitoring-kube-promet-prometheus
    namespace: forgeops-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: g09-prometheus-rehearsal-reader
