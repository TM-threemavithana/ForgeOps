# ForgeOps G09 — Namespaced Prometheus discovery
# ForgeOps G09 — Prometheus read-only discovery
# Candidate; NOT APPROVED FOR DEPLOYMENT.

# Monitoring namespace permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: g09-prometheus-discovery
  namespace: forgeops-observability
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: g09-prometheus-discovery
  namespace: forgeops-observability
subjects:
  - kind: ServiceAccount
    name: g09-monitoring-kube-promet-prometheus
    namespace: forgeops-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: g09-prometheus-discovery
