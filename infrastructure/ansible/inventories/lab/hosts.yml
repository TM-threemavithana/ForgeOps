---
# ForgeOps Lab Inventory Template
# Tracked baseline inventory for local Ubuntu Server 24.04 guest VM
# Host keys are strictly verified against ~/.ssh/known_hosts (host_key_checking = True in ansible.cfg)
# To override machine-specific IP/port locally, use untracked 'hosts.local.yml' or 'inventory.override.yml'

all:
  children:
    managed_lab:
      children:
        webservers:
          hosts:
            forgeops-node-01:
              ansible_host: 127.0.0.1
              ansible_port: 2222
              ansible_user: ops
              ansible_ssh_private_key_file: ~/.ssh/forgeops_lab_ed25519
