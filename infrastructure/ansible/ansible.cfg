[defaults]
# ForgeOps Ansible Controller Configuration (WSL2)
# Local-first execution profile; strict resource and security bounds

inventory               = inventories/lab/hosts.yml
roles_path              = roles:../roles:./infrastructure/ansible/roles
collections_path        = ~/.ansible/collections:/usr/share/ansible/collections:/usr/lib/python3/dist-packages/ansible_collections
retry_files_enabled     = False
host_key_checking       = True
remote_user             = ops
nocows                  = 1
stdout_callback         = yaml
bin_ansible_callbacks   = True
timeout                 = 30
interpreter_python      = auto_silent

# Do not log sensitive variables
no_log                  = False

[privilege_escalation]
become                  = True
become_method           = sudo
become_user             = root
become_ask_pass         = False

[ssh_connection]
pipelining              = True
# Enforces trusted host-key verification against ~/.ssh/known_hosts
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s
