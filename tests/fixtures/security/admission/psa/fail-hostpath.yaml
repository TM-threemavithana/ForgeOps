apiVersion: v1
kind: Pod
metadata:
  name: test-psa-fail-hostpath
  namespace: forgeops-g09-psa
  labels:
    app.kubernetes.io/name: test-psa-fail-hostpath
    forgeops.dev/fixture: negative
spec:
  restartPolicy: Never
  containers:
    - name: test-container
      image: alpine:3.20
      command: ["sh", "-c", "sleep 10"]
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: host-root
          mountPath: /host-mnt
  volumes:
    - name: host-root
      hostPath:
        path: /var/log
