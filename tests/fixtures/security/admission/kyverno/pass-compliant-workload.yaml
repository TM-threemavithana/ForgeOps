apiVersion: v1
kind: Pod
metadata:
  name: test-kyverno-pass-compliant
  namespace: forgeops-g09-kyverno
  labels:
    app.kubernetes.io/name: test-kyverno-pass-compliant
    forgeops.dev/fixture: positive
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-container
      image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      command: ["sh", "-c", "echo 'Kyverno compliant workload admitted and running' && sleep 5"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
