apiVersion: v1
kind: Pod
metadata:
  name: test-kyverno-fail-mutable-tag
  namespace: forgeops-g09-kyverno
  labels:
    app.kubernetes.io/name: test-kyverno-fail-mutable-tag
    forgeops.dev/fixture: negative
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-container
      # Mutable tag without SHA-256 digest
      image: alpine:3.20
      command: ["sh", "-c", "sleep 10"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
