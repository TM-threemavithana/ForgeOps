apiVersion: v1
kind: Pod
metadata:
  name: test-kyverno-fail-hostpath
  namespace: forgeops-g09-kyverno
  labels:
    app.kubernetes.io/name: test-kyverno-fail-hostpath
    forgeops.dev/fixture: negative
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-container
      image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      command: ["sh", "-c", "sleep 10"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: host-root
          mountPath: /host-mnt
  volumes:
    - name: host-root
      hostPath:
        path: /var/log
