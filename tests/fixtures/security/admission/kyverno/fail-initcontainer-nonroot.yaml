apiVersion: v1
kind: Pod
metadata:
  name: test-kyverno-fail-initcontainer-nonroot
  namespace: forgeops-g09-kyverno
  labels:
    app.kubernetes.io/name: test-kyverno-fail-initcontainer-nonroot
    forgeops.dev/fixture: negative-initcontainer
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: insecure-init
      image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      command: ["sh", "-c", "echo init"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: false # Insecure override: running as root or disabling non-root
        capabilities:
          drop:
            - ALL
  containers:
    - name: test-container
      image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      command: ["sh", "-c", "echo app"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
