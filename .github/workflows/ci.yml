# ForgeOps Continuous Integration Pipeline
# Gate G03: GitHub Actions CI/CD, Supply Chain Security and GHCR Publishing
#
# Trust boundary:
#   push/PR to master triggers full CI (build, test, Docker validation, Trivy, Gitleaks)
#   This workflow NEVER pushes to GHCR.
#   Image publishing is exclusively controlled by publish.yml (workflow_dispatch only).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Xmx1g -XX:+UseContainerSupport"
  IMAGE_NAME: forgetasks-api

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Build and Test
  # Compiles source, runs unit and integration tests, enforces JaCoCo coverage
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ["21"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build test and enforce JaCoCo coverage gate
        working-directory: apps/forgetasks-api
        run: ./mvnw clean verify -B -e

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report-java${{ matrix.java }}
          path: apps/forgetasks-api/target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire and Failsafe test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java${{ matrix.java }}
          path: |
            apps/forgetasks-api/target/surefire-reports/
            apps/forgetasks-api/target/failsafe-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Docker Build Validation
  # Validates the multi-stage Dockerfile builds correctly without pushing.
  # BuildKit layer caching keeps the job fast on repeated runs.
  # ---------------------------------------------------------------------------
  docker-build-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as non-root UID 10001
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          USER_ID=$(docker inspect --format '{{ .Config.User }}' "$IMAGE_TAG")
          echo "Container user: $USER_ID"
          if [ "$USER_ID" = "10001:10001" ] || [ "$USER_ID" = "10001" ]; then
            echo "[PASS] Container runs as non-root UID 10001"
          else
            echo "[FAIL] Container user is $USER_ID; expected 10001:10001"
            exit 1
          fi

      - name: Verify no sensitive keywords in image labels
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          LABELS=$(docker inspect "$IMAGE_TAG" --format '{{ json .Config.Labels }}')
          echo "Image labels: $LABELS"
          if echo "$LABELS" | grep -iEq '(password|secret|token|credential)'; then
            echo "[FAIL] Sensitive keyword found in image labels"
            exit 1
          fi
          echo "[PASS] No sensitive keywords in image labels"

  # ---------------------------------------------------------------------------
  # Job 3: Container Security Scan (Trivy)
  # Scans the built image for OS and library vulnerabilities.
  # SARIF results are uploaded to GitHub Code Scanning.
  # Gate: zero CRITICAL unfixed CVEs causes build failure.
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build-validate
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          load: true
          cache-from: type=gha

      - name: Run Trivy scan (SARIF output for Code Scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Enforce zero CRITICAL vulnerabilities (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ---------------------------------------------------------------------------
  # Job 4: Secret Leak Detection (Gitleaks)
  # Scans full repository history for accidentally committed secrets.
  # ---------------------------------------------------------------------------
  gitleaks-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 5: SRE Reliability & Disaster Recovery Hardening Validation (Gate G12 & G13)
  # Validates k6 test suites, resilience experiment scripts, DR workflows, safety guards, manifests
  # ---------------------------------------------------------------------------
  sre-hardening-validate:
    name: SRE & DR Hardening Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install --quiet bcrypt

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Ensure PostgreSQL client tools
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v pg_restore >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          pg_dump --version
          pg_restore --version

      - name: Verify tools
        run: |
          k6 version
          kubectl version --client=true
          python3 --version

      - name: Run G12 SRE Hardening Validation Suite
        run: python3 scripts/test_g12_hardening.py

      - name: Run G13 Disaster Recovery Hardening Validation Suite
        run: python3 scripts/test_g13_dr_hardening.py

  # ---------------------------------------------------------------------------
  # Job 6: Kyverno Policy-as-Code & Security Validation (Gate G14)
  # Pre-deployment static Kubernetes manifest validation & security assertions
  # ---------------------------------------------------------------------------
  security-policy-validate:
    name: Security Policy & Secrets Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install --quiet pyyaml

      - name: Install Pinned Kyverno CLI (v1.19.2) with Authentic Checksum Verification
        run: |
          KYVERNO_VERSION="v1.19.2"
          KYVERNO_SHA256="357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a"
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o kyverno.tar.gz
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar -xzf kyverno.tar.gz kyverno
          sudo mv kyverno /usr/local/bin/
          rm -f kyverno.tar.gz
          kyverno version

      - name: Install Pinned SOPS (v3.13.3) and age (v1.2.1) with Authentic Checksum Verification
        run: |
          SOPS_VERSION="v3.13.3"
          SOPS_SHA256="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
          curl -sSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o sops
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops
          sops --version

          AGE_VERSION="v1.2.1"
          AGE_SHA256="7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
          curl -sSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" -o age.tar.gz
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          sudo mv age/age age/age-keygen /usr/local/bin/
          rm -rf age.tar.gz age
          age --version
          age-keygen --version

      - name: Run Kyverno Test Suite (20 assertions across 10 security controls)
        run: kyverno test security/policies/kyverno/tests

      - name: Run Gate G14 Automated Security & Policy Suite
        run: python3 scripts/test_g14_security.py

      - name: Run Gate G14 SOPS & age Encrypted Secrets Validation Suite
        run: python3 scripts/test_g14_sops.py

      - name: Demonstrate Valid Compliant Manifest Passes All Policies
        run: |
          kyverno apply security/policies/kyverno/disallow-privileged-containers.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-privilege-escalation.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-run-as-non-root.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-drop-all-capabilities.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-seccomp-default.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-latest-tag.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-resource-requests-limits.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-host-namespaces.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/restrict-image-registries.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-security-labels.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          echo "[PASS] Compliant workload manifest passed all 10 security policies."

      - name: Demonstrate Privileged Test Manifest Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-privileged-containers.yaml --resource security/policies/kyverno/tests/fail-privileged.yaml; then
            echo "[FAIL] Privileged container was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Privileged container correctly rejected by policy."
          fi

      - name: Demonstrate Mutable Latest Image Tag Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-latest-tag.yaml --resource security/policies/kyverno/tests/fail-latest-tag.yaml; then
            echo "[FAIL] Latest image tag was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Latest image tag correctly rejected by policy."
          fi

      - name: Demonstrate Unsafe Security Context (Privilege Escalation) Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-privilege-escalation.yaml --resource security/policies/kyverno/tests/fail-privilege-escalation.yaml; then
            echo "[FAIL] Privilege escalation was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Privilege escalation correctly rejected by policy."
          fi

  # ---------------------------------------------------------------------------
  # Job 7: CI Gate Summary (required status check for branch protection rules)
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build-validate
      - trivy-scan
      - gitleaks-scan
      - sre-hardening-validate
      - security-policy-validate
    if: always()

    steps:
      - name: Evaluate gate status
        run: |
          echo '=== G03/G12/G14 CI Gate Summary ==='
          echo "build-and-test:           ${{ needs.build-and-test.result }}"
          echo "docker-build-validate:    ${{ needs.docker-build-validate.result }}"
          echo "trivy-scan:               ${{ needs.trivy-scan.result }}"
          echo "gitleaks-scan:            ${{ needs.gitleaks-scan.result }}"
          echo "sre-hardening-validate:   ${{ needs.sre-hardening-validate.result }}"
          echo "security-policy-validate: ${{ needs.security-policy-validate.result }}"
          echo '===================================='
          FAILED=0
          [ "${{ needs.build-and-test.result }}" != "success" ] && FAILED=1
          [ "${{ needs.docker-build-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.trivy-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.gitleaks-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.sre-hardening-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.security-policy-validate.result }}" != "success" ] && FAILED=1
          if [ "$FAILED" = "1" ]; then
            echo "[FAIL] One or more required CI jobs failed. Merge is blocked."
            exit 1
          fi
          echo "[PASS] All CI gate jobs passed. Merge is permitted."