# ForgeOps Continuous Integration Pipeline
# Gate G03: GitHub Actions CI/CD, Supply Chain Security and GHCR Publishing
#
# Trust boundary:
#   push/PR to master triggers full CI (build, test, Docker validation, Trivy, Gitleaks)
#   This workflow NEVER pushes to GHCR.
#   Image publishing is exclusively controlled by publish.yml (workflow_dispatch only).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Xmx1g -XX:+UseContainerSupport"
  IMAGE_NAME: forgetasks-api

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Build and Test
  # Compiles source, runs unit and integration tests, enforces JaCoCo coverage
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ["21"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build test and enforce JaCoCo coverage gate
        working-directory: apps/forgetasks-api
        run: ./mvnw clean verify -B -e

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report-java${{ matrix.java }}
          path: apps/forgetasks-api/target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire and Failsafe test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java${{ matrix.java }}
          path: |
            apps/forgetasks-api/target/surefire-reports/
            apps/forgetasks-api/target/failsafe-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Docker Build Validation
  # Validates the multi-stage Dockerfile builds correctly without pushing.
  # BuildKit layer caching keeps the job fast on repeated runs.
  # ---------------------------------------------------------------------------
  docker-build-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as non-root UID 10001
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          USER_ID=$(docker inspect --format '{{ .Config.User }}' "$IMAGE_TAG")
          echo "Container user: $USER_ID"
          if [ "$USER_ID" = "10001:10001" ] || [ "$USER_ID" = "10001" ]; then
            echo "[PASS] Container runs as non-root UID 10001"
          else
            echo "[FAIL] Container user is $USER_ID; expected 10001:10001"
            exit 1
          fi

      - name: Verify no sensitive keywords in image labels
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          LABELS=$(docker inspect "$IMAGE_TAG" --format '{{ json .Config.Labels }}')
          echo "Image labels: $LABELS"
          if echo "$LABELS" | grep -iEq '(password|secret|token|credential)'; then
            echo "[FAIL] Sensitive keyword found in image labels"
            exit 1
          fi
          echo "[PASS] No sensitive keywords in image labels"

  # ---------------------------------------------------------------------------
  # Job 3: Container Security Scan (Trivy)
  # Scans the built image for OS and library vulnerabilities.
  # SARIF results are uploaded to GitHub Code Scanning.
  # Gate: zero CRITICAL unfixed CVEs causes build failure.
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build-validate
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          load: true
          cache-from: type=gha

      - name: Run Trivy scan (SARIF output for Code Scanning)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Enforce zero CRITICAL vulnerabilities (gate)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  # ---------------------------------------------------------------------------
  # Job 4: Secret Leak Detection (Gitleaks)
  # Scans full repository history for accidentally committed secrets.
  # ---------------------------------------------------------------------------
  gitleaks-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 5: CI Gate Summary (required status check for branch protection rules)
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build-validate
      - trivy-scan
      - gitleaks-scan
    if: always()

    steps:
      - name: Evaluate gate status
        run: |
          echo '=== G03 CI Gate Summary ==='
          echo "build-and-test:        ${{ needs.build-and-test.result }}"
          echo "docker-build-validate: ${{ needs.docker-build-validate.result }}"
          echo "trivy-scan:            ${{ needs.trivy-scan.result }}"
          echo "gitleaks-scan:         ${{ needs.gitleaks-scan.result }}"
          echo '==========================='
          FAILED=0
          [ "${{ needs.build-and-test.result }}" != "success" ] && FAILED=1
          [ "${{ needs.docker-build-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.trivy-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.gitleaks-scan.result }}" != "success" ] && FAILED=1
          if [ "$FAILED" = "1" ]; then
            echo "[FAIL] One or more required CI jobs failed. Merge is blocked."
            exit 1
          fi
          echo "[PASS] All CI gate jobs passed. Merge is permitted."