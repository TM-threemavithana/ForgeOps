# ForgeOps Continuous Integration Pipeline
# Gate G03 & G09: GitHub Actions CI/CD, Supply Chain Security and GHCR Publishing
#
# Trust boundary:
#   push/PR to master triggers full CI (build, test, Docker validation, Trivy, Gitleaks, Semgrep, Dependency scan, Checkov, Hadolint)
#   This workflow NEVER pushes to GHCR.
#   Image publishing is exclusively controlled by publish.yml (workflow_dispatch only).

name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master, "feature/**"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Xmx1g -XX:+UseContainerSupport"
  IMAGE_NAME: forgetasks-api

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Build and Test
  # Compiles source, runs unit and integration tests, enforces JaCoCo coverage
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ["21"]

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Cache Maven local repository
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build test and enforce JaCoCo coverage gate
        working-directory: apps/forgetasks-api
        run: ./mvnw clean verify -B -e

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jacoco-coverage-report-java${{ matrix.java }}
          path: apps/forgetasks-api/target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire and Failsafe test reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: test-reports-java${{ matrix.java }}
          path: |
            apps/forgetasks-api/target/surefire-reports/
            apps/forgetasks-api/target/failsafe-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Docker Build Validation
  # Validates the multi-stage Dockerfile builds correctly without pushing.
  # BuildKit layer caching keeps the job fast on repeated runs.
  # ---------------------------------------------------------------------------
  docker-build-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as non-root UID 10001
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          USER_ID=$(docker inspect --format '{{ .Config.User }}' "$IMAGE_TAG")
          echo "Container user: $USER_ID"
          if [ "$USER_ID" = "10001:10001" ] || [ "$USER_ID" = "10001" ]; then
            echo "[PASS] Container runs as non-root UID 10001"
          else
            echo "[FAIL] Container user is $USER_ID; expected 10001:10001"
            exit 1
          fi

      - name: Verify no sensitive keywords in image labels
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
        run: |
          LABELS=$(docker inspect "$IMAGE_TAG" --format '{{ json .Config.Labels }}')
          echo "Image labels: $LABELS"
          if echo "$LABELS" | grep -iEq '(password|secret|token|credential)'; then
            echo "[FAIL] Sensitive keyword found in image labels"
            exit 1
          fi
          echo "[PASS] No sensitive keywords in image labels"

  # ---------------------------------------------------------------------------
  # Job 3: Container Security Scan (Trivy)
  # Scans the built image for OS and library vulnerabilities.
  # SARIF results are uploaded to GitHub Code Scanning.
  # Gate: zero HIGH or CRITICAL unfixed CVEs causes build failure.
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build-validate
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/forgetasks-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build image for Trivy scan
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          load: true
          cache-from: type=gha

      - name: Run Trivy scan (SARIF output for Code Scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Enforce zero HIGH and CRITICAL vulnerabilities (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ---------------------------------------------------------------------------
  # Job 4: Secret Leak Detection (Gitleaks)
  # Scans full repository history for accidentally committed secrets.
  # ---------------------------------------------------------------------------
  gitleaks-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 5: SAST Security Scan (Semgrep OSS) - Gate G09
  # Scans Java application source for OWASP Top 10, CWE-89 SQLi, command injection,
  # weak crypto, and unvalidated path traversal flaws.
  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: Semgrep SAST Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install --quiet pyyaml semgrep==1.185.0 checkov==3.4.5

      - name: Install Pinned Hadolint (v2.12.0) with Authentic Checksum Verification
        run: |
          HADOLINT_VERSION="v2.12.0"
          HADOLINT_SHA256="56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm -f hadolint
          hadolint --version

      - name: Verify tool versions
        run: |
          semgrep --version
          checkov --version
          hadolint --version

      - name: Run Gate G09 DevSecOps Security Validation Suite
        run: python3 scripts/test_g09_security.py

      - name: Run Semgrep SAST Scan (SARIF output for Code Scanning)
        run: |
          semgrep scan \
            --config security/sast/semgrep-rules.yaml \
            --sarif --output semgrep-results.sarif \
            --error \
            apps/forgetasks-api/src/main

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

  # ---------------------------------------------------------------------------
  # Job 6: Maven Dependency Vulnerability Scan (Trivy) - Gate G09
  # Analyzes Maven dependencies (direct and transitive) for known CVEs.
  # Gate: zero HIGH or CRITICAL vulnerabilities causes failure.
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Maven Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Filesystem Dependency Scan (SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/forgetasks-api'
          format: sarif
          output: trivy-fs-results.sarif
          vuln-type: library
          severity: CRITICAL,HIGH

      - name: Upload Dependency SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-maven-dependencies

      - name: Enforce Zero CRITICAL and HIGH Dependency Vulnerabilities (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/forgetasks-api'
          format: table
          exit-code: '1'
          vuln-type: library
          severity: CRITICAL,HIGH

  # ---------------------------------------------------------------------------
  # Job 7: Infrastructure as Code (IaC) Security Scan (Checkov) - Gate G09.2
  # Scans Terraform modules for security misconfigurations and demonstrates
  # synthetic rejection on deliberately vulnerable infrastructure fixtures.
  # ---------------------------------------------------------------------------
  iac-checkov-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Pinned Checkov (v3.4.5)
        run: pip install --quiet checkov==3.4.5

      - name: Run Checkov Scan on Production Terraform Modules
        run: |
          checkov -d infrastructure/terraform --framework terraform --output cli --output sarif --output-file-path . --soft-fail || true

      - name: Upload Checkov SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov-iac-scan
        continue-on-error: true

      - name: Enforce Checkov Zero Blocking Failures on Terraform
        run: |
          checkov -d infrastructure/terraform --framework terraform --quiet --compact

      - name: Demonstrate Insecure Terraform Fixture Rejection
        run: |
          if checkov -f security/iac/checkov/fixtures/fail-s3-public.tf --framework terraform --quiet; then
            echo "[FAIL] Insecure Terraform resource was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Insecure Terraform resource correctly rejected by Checkov."
          fi

  # ---------------------------------------------------------------------------
  # Job 8: Dockerfile Static Analysis & Best Practices (Hadolint) - Gate G09.2
  # Enforces container build security best practices and rejects unsafe directives.
  # ---------------------------------------------------------------------------
  dockerfile-hadolint:
    name: Hadolint Dockerfile Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pinned Hadolint (v2.12.0) with Authentic Checksum Verification
        run: |
          HADOLINT_VERSION="v2.12.0"
          HADOLINT_SHA256="56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm -f hadolint
          hadolint --version

      - name: Lint Production Application Dockerfile
        run: hadolint apps/forgetasks-api/Dockerfile

      - name: Demonstrate Insecure Dockerfile Directives Rejection
        run: |
          if hadolint security/container/hadolint/fixtures/fail-insecure.Dockerfile; then
            echo "[FAIL] Insecure Dockerfile was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Insecure Dockerfile correctly rejected by Hadolint."
          fi

      - name: Demonstrate Compliant Dockerfile Acceptance
        run: hadolint security/container/hadolint/fixtures/pass-compliant.Dockerfile

  # ---------------------------------------------------------------------------
  # Job 9: SRE Reliability & Disaster Recovery Hardening Validation (Gate G12 & G13)
  # Validates k6 test suites, resilience experiment scripts, DR workflows, safety guards, manifests
  # ---------------------------------------------------------------------------
  sre-hardening-validate:
    name: SRE & DR Hardening Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install --quiet bcrypt

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      - name: Ensure PostgreSQL client tools
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v pg_restore >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          pg_dump --version
          pg_restore --version

      - name: Verify tools
        run: |
          k6 version
          kubectl version --client=true
          python3 --version

      - name: Run G12 SRE Hardening Validation Suite
        run: python3 scripts/test_g12_hardening.py

      - name: Run G13 Disaster Recovery Hardening Validation Suite
        run: python3 scripts/test_g13_dr_hardening.py

  # ---------------------------------------------------------------------------
  # Job 10: Kyverno Policy-as-Code & Security Validation (Gate G14)
  # Pre-deployment static Kubernetes manifest validation & security assertions
  # ---------------------------------------------------------------------------
  security-policy-validate:
    name: Security Policy & Secrets Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install --quiet pyyaml

      - name: Install Pinned Kyverno CLI (v1.19.2) with Authentic Checksum Verification
        run: |
          KYVERNO_VERSION="v1.19.2"
          KYVERNO_SHA256="357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a"
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o kyverno.tar.gz
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar -xzf kyverno.tar.gz kyverno
          sudo mv kyverno /usr/local/bin/
          rm -f kyverno.tar.gz
          kyverno version

      - name: Install Pinned SOPS (v3.13.3) and age (v1.2.1) with Authentic Checksum Verification
        run: |
          SOPS_VERSION="v3.13.3"
          SOPS_SHA256="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
          curl -sSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o sops
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops
          sops --version

          AGE_VERSION="v1.2.1"
          AGE_SHA256="7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
          curl -sSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" -o age.tar.gz
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          sudo mv age/age age/age-keygen /usr/local/bin/
          rm -rf age.tar.gz age
          age --version
          age-keygen --version

      - name: Run Kyverno Test Suite (20 assertions across 10 security controls)
        run: kyverno test security/policies/kyverno/tests

      - name: Run Gate G14 Automated Security & Policy Suite
        run: python3 scripts/test_g14_security.py

      - name: Run Gate G14 SOPS & age Encrypted Secrets Validation Suite
        run: python3 scripts/test_g14_sops.py

      - name: Demonstrate Valid Compliant Manifest Passes All Policies
        run: |
          kyverno apply security/policies/kyverno/disallow-privileged-containers.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-privilege-escalation.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-run-as-non-root.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-drop-all-capabilities.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-seccomp-default.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-latest-tag.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-resource-requests-limits.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/disallow-host-namespaces.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/restrict-image-registries.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          kyverno apply security/policies/kyverno/require-security-labels.yaml --resource security/policies/kyverno/tests/pass-workload.yaml
          echo "[PASS] Compliant workload manifest passed all 10 security policies."

      - name: Demonstrate Privileged Test Manifest Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-privileged-containers.yaml --resource security/policies/kyverno/tests/fail-privileged.yaml; then
            echo "[FAIL] Privileged container was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Privileged container correctly rejected by policy."
          fi

      - name: Demonstrate Mutable Latest Image Tag Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-latest-tag.yaml --resource security/policies/kyverno/tests/fail-latest-tag.yaml; then
            echo "[FAIL] Latest image tag was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Latest image tag correctly rejected by policy."
          fi

      - name: Demonstrate Unsafe Security Context (Privilege Escalation) Rejection
        run: |
          if kyverno apply security/policies/kyverno/disallow-privilege-escalation.yaml --resource security/policies/kyverno/tests/fail-privilege-escalation.yaml; then
            echo "[FAIL] Privilege escalation was unexpectedly accepted!"
            exit 1
          else
            echo "[PASS] Privilege escalation correctly rejected by policy."
          fi

      - name: Run Gate G09.4 Admission Validation Suite (Evidence Mode)
        run: python3 scripts/test_g09_admission.py --mode evidence

      - name: Demonstrate Gate G09.4 Kyverno Policy-as-Code Acceptance & Rejection (Zero Deprecations)
        run: |
          echo "=== Verifying Gate G09.4 Compliant Workload Acceptance (Pods & Deployments) ==="
          kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/pass-compliant-workload.yaml --warnings-as-errors
          kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/pass-deployment-compliant.yaml --warnings-as-errors
          echo "=== Verifying Gate G09.4 Negative Workload Rejections (Pods & Deployments) ==="
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-mutable-tag.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-hostpath.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-privileged.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-security-context.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-deployment-insecure.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-initcontainer-nonroot.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-initcontainer-seccomp.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-fake-digest-image.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-non-sha256-digest-image.yaml --warnings-as-errors
          ! kyverno apply security/admission/kyverno/policies/ --resource tests/fixtures/security/admission/kyverno/fail-ephemeral-container.yaml --warnings-as-errors
          echo "[PASS] Gate G09.4 CEL policy acceptance and rejections verified with zero deprecation warnings."

  # ---------------------------------------------------------------------------
  # Job 11: OWASP ZAP Baseline DAST Scan (Gate G09.3)
  # ---------------------------------------------------------------------------
  dast-zap-scan:
    name: OWASP ZAP Baseline DAST Scan
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven local repository
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Create Ephemeral DAST Test Network
        run: docker network create zap-test-net

      - name: Start Ephemeral PostgreSQL
        run: |
          docker run -d --name zap-test-postgres \
            --network zap-test-net \
            -e POSTGRES_DB=forgetasks_test \
            -e POSTGRES_USER=forge_test \
            -e POSTGRES_PASSWORD=forge_test_secret \
            postgres:16-alpine
          
          # Wait for PostgreSQL
          for i in {1..30}; do
            if docker exec zap-test-postgres pg_isready -U forge_test; then
              echo "[PASS] Ephemeral PostgreSQL is ready."
              break
            fi
            sleep 1
          done

      - name: Build and Start Ephemeral ForgeTasks API Container
        run: |
          docker build -t forgetasks-api:dast apps/forgetasks-api
          docker run -d --name zap-test-app \
            --network zap-test-net \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://zap-test-postgres:5432/forgetasks_test \
            -e SPRING_DATASOURCE_USERNAME=forge_test \
            -e SPRING_DATASOURCE_PASSWORD=forge_test_secret \
            -e PORT=8080 \
            -e MANAGEMENT_PORT=8080 \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318/v1/traces \
            forgetasks-api:dast

          # Wait for application health probe
          for i in {1..60}; do
            STATUS=$(docker run --rm --network zap-test-net curlimages/curl:8.10.1 -s http://zap-test-app:8080/actuator/health || true)
            if echo "$STATUS" | grep -q "UP"; then
              echo "[PASS] Ephemeral ForgeTasks API is UP and healthy."
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "[FAIL] Application failed to start. Logs:"
              docker logs zap-test-app
              exit 1
            fi
          done

      - name: Run OWASP ZAP API DAST Scan with OpenAPI
        run: |
          mkdir -p target/zap-reports
          chmod 777 target/zap-reports

          set +e
          docker run --rm \
            --network zap-test-net \
            -v ${{ github.workspace }}/target/zap-reports:/zap/wrk/:rw \
            -v ${{ github.workspace }}/security/dast/zap/zap-rules.conf:/zap/rules.conf:ro \
            -v ${{ github.workspace }}/security/dast/zap/openapi.yaml:/zap/openapi.yaml:ro \
            ghcr.io/zaproxy/zaproxy:2.16.0@sha256:391f66efa53b30de40d4a1c6e28146477263552fc828bc7613c9cd11a2949908 \
            zap-api-scan.py \
            -t /zap/openapi.yaml \
            -f openapi \
            -O http://zap-test-app:8080 \
            -c /zap/rules.conf \
            -r report.html \
            -J report.json \
            -w report.md \
            -S \
            -I
          ZAP_RC=$?
          set -e
          echo "ZAP API scan exit code: $ZAP_RC"

      - name: Evaluate ZAP DAST Findings (Enforce Zero High/Medium Alerts & Report Integrity)
        run: |
          python3 -c "
          import json, sys, os

          report_path = 'target/zap-reports/report.json'
          if not os.path.isfile(report_path) or os.path.getsize(report_path) == 0:
              print(f'[FAIL] DAST scan report missing or empty (0 bytes): {report_path}')
              sys.exit(1)

          try:
              with open(report_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'[FAIL] DAST scan report contains malformed JSON: {e}')
              sys.exit(1)

          if not isinstance(data, dict):
              print('[FAIL] DAST scan report root is not a JSON object.')
              sys.exit(1)

          sites = data.get('site', [])
          if not sites or not isinstance(sites, list) or len(sites) == 0:
              print('[FAIL] DAST scan report is incomplete: zero sites analyzed.')
              sys.exit(1)

          target_matched = any('zap-test-app' in s.get('@name', '') or '8080' in str(s.get('@port', '')) or 'localhost' in s.get('@name', '') for s in sites)
          if not target_matched:
              print(f'[FAIL] Expected target host not found in analyzed sites: {[s.get(\"@name\") for s in sites]}')
              sys.exit(1)

          highs = 0
          mediums = 0
          lows = 0
          infos = 0
          for site in sites:
              for alert in site.get('alerts', []):
                  risk = alert.get('riskdesc', '').split('(')[0].strip()
                  risk_code = str(alert.get('riskcode', ''))
                  name = alert.get('name')
                  if risk == 'High' or risk_code == '3':
                      highs += 1
                      print(f'  [HIGH] {name} ({alert.get(\"riskdesc\")})')
                  elif risk == 'Medium' or risk_code == '2':
                      mediums += 1
                      print(f'  [MEDIUM] {name} ({alert.get(\"riskdesc\")})')
                  elif risk == 'Low' or risk_code == '1':
                      lows += 1
                      print(f'  [LOW] {name} ({alert.get(\"riskdesc\")})')
                  else:
                      infos += 1
                      print(f'  [INFO/LOW] {name} ({alert.get(\"riskdesc\")})')

          print(f'ZAP Findings Summary: High={highs}, Medium={mediums}, Low={lows}, Info={infos}')
          if highs > 0 or mediums > 0:
              print(f'[FAIL] Security gate violation: {highs} HIGH and {mediums} MEDIUM DAST alerts detected.')
              sys.exit(1)
          print('[PASS] Zero High/Medium DAST alerts detected and report integrity verified. DAST gate passed.')
          "

      - name: Upload ZAP DAST Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: owasp-zap-dast-reports
          path: target/zap-reports/
          retention-days: 14

      - name: Teardown Ephemeral DAST Containers & Network
        if: always()
        run: |
          docker rm -f zap-test-app zap-test-postgres 2>/dev/null || true
          docker network rm zap-test-net 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 12: CI Gate Summary (required status check for branch protection rules)
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build-validate
      - trivy-scan
      - gitleaks-scan
      - sast-semgrep
      - dependency-scan
      - iac-checkov-scan
      - dockerfile-hadolint
      - sre-hardening-validate
      - security-policy-validate
      - dast-zap-scan
    if: always()

    steps:
      - name: Evaluate gate status
        run: |
          echo '=== G03/G09/G12/G14 CI Gate Summary ==='
          echo "build-and-test:           ${{ needs.build-and-test.result }}"
          echo "docker-build-validate:    ${{ needs.docker-build-validate.result }}"
          echo "trivy-scan:               ${{ needs.trivy-scan.result }}"
          echo "gitleaks-scan:            ${{ needs.gitleaks-scan.result }}"
          echo "sast-semgrep:             ${{ needs.sast-semgrep.result }}"
          echo "dependency-scan:          ${{ needs.dependency-scan.result }}"
          echo "iac-checkov-scan:         ${{ needs.iac-checkov-scan.result }}"
          echo "dockerfile-hadolint:      ${{ needs.dockerfile-hadolint.result }}"
          echo "sre-hardening-validate:   ${{ needs.sre-hardening-validate.result }}"
          echo "security-policy-validate: ${{ needs.security-policy-validate.result }}"
          echo "dast-zap-scan:            ${{ needs.dast-zap-scan.result }}"
          echo '===================================='
          FAILED=0
          [ "${{ needs.build-and-test.result }}" != "success" ] && FAILED=1
          [ "${{ needs.docker-build-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.trivy-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.gitleaks-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.sast-semgrep.result }}" != "success" ] && FAILED=1
          [ "${{ needs.dependency-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.iac-checkov-scan.result }}" != "success" ] && FAILED=1
          [ "${{ needs.dockerfile-hadolint.result }}" != "success" ] && FAILED=1
          [ "${{ needs.sre-hardening-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.security-policy-validate.result }}" != "success" ] && FAILED=1
          [ "${{ needs.dast-zap-scan.result }}" != "success" ] && FAILED=1
          if [ "$FAILED" = "1" ]; then
            echo "[FAIL] One or more required CI jobs failed. Merge is blocked."
            exit 1
          fi
          echo "[PASS] All CI gate jobs passed. Merge is permitted."
