# ForgeOps GHCR Image Publishing Pipeline
# Gate G03: Controlled, Hardened Release to GitHub Container Registry (GHCR)
#
# Trust Boundary & Architecture:
#   - Triggered EXCLUSIVELY by manual workflow_dispatch (never on push, PR, or schedule)
#   - Input Injection Defense: all workflow inputs are sanitized via env variables with regex guards
#   - Confirmation Guard: requires explicit literal "PUBLISH"
#   - Cryptographic Pinning: requires full 40-character commit SHA
#   - Trusted History Enforcement: commit must exist in repo, belong to origin/master history,
#     and match current origin/master HEAD (initial publishing policy)
#   - CI Gate Verification: queries GitHub API to ensure the exact source SHA has a successful
#     run in ci.yml and that the mandatory "CI Gate" check passed
#   - Protected Environment: executes publish job in the "release" GitHub Environment with required reviewers
#   - Build-Once, Scan-Then-Publish: image is built once, loaded into Docker daemon, scanned by Trivy
#     (blocking on CRITICAL and HIGH CVEs), and pushed directly without rebuilding (zero rebuild disparity)
#   - Immutable Digest Capture: captures sha256:... digest from registry and attests build provenance
#   - Least-Privilege: packages:write is scoped strictly to the publish job; top-level is read-only

name: Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Exact 40-character Git commit SHA to build and publish (must be verified on master)"
        required: true
        type: string
      semver_tag:
        description: "Optional semantic version tag (e.g. 1.0.0). Leave blank for SHA-only tagging."
        required: false
        type: string
        default: ""
      confirm:
        description: "Type PUBLISH to confirm intentional image publication"
        required: true
        type: string

# Global least-privilege: read-only by default
permissions:
  contents: read

# Concurrency: prevent simultaneous release runs that could race on image tags
concurrency:
  group: publish-ghcr
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/forgetasks-api

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Validate Release Inputs, Git Ancestry, and CI Verification Status
  # ---------------------------------------------------------------------------
  validate-release:
    name: Validate Release Authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    outputs:
      validated_sha: ${{ steps.validate-commit.outputs.validated_sha }}
      short_sha: ${{ steps.validate-commit.outputs.short_sha }}
      semver_tag: ${{ steps.validate-inputs.outputs.semver_tag }}

    steps:
      - name: Validate workflow trigger ref, inputs, and confirmation guard
        id: validate-inputs
        env:
          WORKFLOW_REF: ${{ github.ref }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          INPUT_SHA: ${{ inputs.git_sha }}
          SEMVER_INPUT: ${{ inputs.semver_tag }}
        run: |
          echo "=== Step 1: Trigger Ref, Input Syntax & Confirmation Guard ==="

          # 1. Verify workflow execution ref is refs/heads/master
          if [ "$WORKFLOW_REF" != "refs/heads/master" ]; then
            echo "::error::Publishing workflow must be dispatched from 'refs/heads/master'. Current trigger ref: '$WORKFLOW_REF'."
            echo "Execution from feature branches, pull requests, or non-master refs is strictly prohibited."
            exit 1
          fi
          echo "[PASS] Workflow trigger ref verified: $WORKFLOW_REF."

          # 2. Check confirmation guard string
          if [ "$CONFIRM_INPUT" != "PUBLISH" ]; then
            echo "::error::Confirmation guard failed. Expected 'PUBLISH', received '$CONFIRM_INPUT'."
            echo "Publication aborted. This guard prevents accidental GHCR releases."
            exit 1
          fi
          echo "[PASS] Confirmation literal 'PUBLISH' verified."

          # 3. Normalize SHA (strip whitespace, lowercase)
          CLEAN_SHA="$(echo "$INPUT_SHA" | tr '[:upper:]' '[:lower:]' | xargs)"
          if ! [[ "$CLEAN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid git_sha '$INPUT_SHA'. A full 40-character hexadecimal SHA is required."
            echo "Short SHAs, branch names, and floating refs are rejected to guarantee cryptographic immutability."
            exit 1
          fi
          echo "[PASS] Full 40-character SHA syntax verified: $CLEAN_SHA"

          # 4. Validate optional semver tag (Docker tag compatible)
          CLEAN_SEMVER="$(echo "$SEMVER_INPUT" | xargs)"
          if [ -n "$CLEAN_SEMVER" ]; then
            # Docker tags forbid '+'. Reject build metadata with clear error.
            if [[ "$CLEAN_SEMVER" == *"+"* ]]; then
              echo "::error::Invalid semver_tag '$CLEAN_SEMVER'. Docker image tags do not support '+' (SemVer build metadata is forbidden in container tags)."
              exit 1
            fi
            # Strict SemVer regex without build metadata (+): X.Y.Z or X.Y.Z-prerelease
            if ! [[ "$CLEAN_SEMVER" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
              echo "::error::Invalid semver_tag '$CLEAN_SEMVER'. Must follow Semantic Versioning (e.g. 1.0.0 or 1.0.0-rc.1) using only Docker-compatible characters."
              exit 1
            fi
            echo "[PASS] Semver tag syntax verified (Docker-compatible): $CLEAN_SEMVER"
          else
            echo "[INFO] No semver tag provided. Publishing will use immutable SHA tags only."
          fi

          echo "clean_sha=$CLEAN_SHA" >> "$GITHUB_OUTPUT"
          echo "semver_tag=$CLEAN_SEMVER" >> "$GITHUB_OUTPUT"

      - name: Checkout repository master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify commit existence and master branch history
        id: validate-commit
        env:
          TARGET_SHA: ${{ steps.validate-inputs.outputs.clean_sha }}
        run: |
          echo "=== Step 2: Git Repository & Ancestry Verification ==="
          git fetch origin master

          # 1. Verify object exists in Git repository
          if ! git rev-parse --verify --quiet "${TARGET_SHA}^{commit}" > /dev/null; then
            echo "::error::Commit $TARGET_SHA does not exist in the official repository."
            exit 1
          fi
          echo "[PASS] Commit object exists in repository."

          # 2. Verify commit is in master history (ancestor check)
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/master; then
            echo "::error::Commit $TARGET_SHA is not an ancestor of origin/master. Commits from unmerged feature branches or untrusted forks are strictly prohibited."
            exit 1
          fi
          echo "[PASS] Commit belongs to trusted master branch history."

          # 3. For initial publishing policy: require matching current master HEAD
          MASTER_HEAD=$(git rev-parse origin/master)
          if [ "$TARGET_SHA" != "$MASTER_HEAD" ]; then
            echo "::error::Target commit $TARGET_SHA does not match current origin/master HEAD ($MASTER_HEAD)."
            echo "Initial publishing policy requires releasing the current verified master HEAD."
            exit 1
          fi
          echo "[PASS] Target commit matches current origin/master HEAD."

          SHORT_SHA=$(git rev-parse --short=7 "$TARGET_SHA")
          echo "validated_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI run and CI Gate check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.validate-commit.outputs.validated_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Step 3: CI Pipeline Verification ==="
          echo "Querying GitHub Actions runs for commit: $TARGET_SHA"

          # Query workflow runs for ci.yml on target commit
          RUNS_JSON=$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}" 2>/dev/null || echo "")

          if [ -z "$RUNS_JSON" ]; then
            echo "::error::Failed to query GitHub Actions API for workflow runs."
            exit 1
          fi

          TOTAL_RUNS=$(echo "$RUNS_JSON" | jq -r '.total_count // 0')
          echo "Found $TOTAL_RUNS workflow run(s) for ci.yml at $TARGET_SHA."

          if [ "$TOTAL_RUNS" -eq 0 ]; then
            echo "::error::No CI run found for commit $TARGET_SHA in ci.yml."
            echo "Only commits that have been verified by the CI pipeline can be published."
            exit 1
          fi

          # Find the latest completed successful run on master
          SUCCESSFUL_RUN_ID=$(echo "$RUNS_JSON" | jq -r '
            [.workflow_runs[] | select(.head_branch == "master" and .status == "completed" and .conclusion == "success")]
            | sort_by(.created_at) | last | .id // empty
          ')

          if [ -z "$SUCCESSFUL_RUN_ID" ]; then
            echo "::error::No successful completed CI run found on master for commit $TARGET_SHA."
            echo "Latest run status/conclusion:"
            echo "$RUNS_JSON" | jq -r '.workflow_runs[0] | "Run ID: \(.id), Status: \(.status), Conclusion: \(.conclusion), Branch: \(.head_branch)"'
            exit 1
          fi

          echo "[PASS] Successful CI workflow run verified: Run ID $SUCCESSFUL_RUN_ID"

          # Verify that the mandatory 'CI Gate' job succeeded within that run
          JOBS_JSON=$(gh api "/repos/${REPO}/actions/runs/${SUCCESSFUL_RUN_ID}/jobs" 2>/dev/null || echo "")
          CI_GATE_STATUS=$(echo "$JOBS_JSON" | jq -r '
            [.jobs[] | select(.name == "CI Gate")] | last | "\(.status):\(.conclusion)" // empty
          ')

          if [ "$CI_GATE_STATUS" != "completed:success" ]; then
            echo "::error::Mandatory 'CI Gate' job status check failed for run $SUCCESSFUL_RUN_ID (status:conclusion = '${CI_GATE_STATUS}')."
            echo "Release blocked: all required CI checks (Maven, Docker build, non-root, Trivy, Gitleaks) must pass."
            exit 1
          fi

          echo "[PASS] Mandatory CI Gate status check verified: completed:success."
          echo "=== All Release Preflight Validation Checks PASSED ==="

  # ---------------------------------------------------------------------------
  # Job 2: Build Once, Scan Once, and Publish the EXACT Scanned Image to GHCR
  # ---------------------------------------------------------------------------
  publish:
    name: Build Scan and Publish to GHCR
    runs-on: ubuntu-latest
    needs: validate-release
    environment:
      name: release
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.validated_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ needs.validate-release.outputs.short_sha }}
            type=raw,value=${{ needs.validate-release.outputs.validated_sha }}
            type=raw,value=${{ needs.validate-release.outputs.semver_tag }},enable=${{ needs.validate-release.outputs.semver_tag != '' }}
          labels: |
            org.opencontainers.image.title=ForgeTasks API
            org.opencontainers.image.description=ForgeTasks REST API and Persistence Service for ForgeOps DevOps Lab
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.validated_sha }}
            org.opencontainers.image.vendor=ForgeOps Platform Engineering
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build candidate container image (build once, load locally)
        uses: docker/build-push-action@v6
        id: build-candidate
        with:
          context: apps/forgetasks-api
          file: apps/forgetasks-api/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            forgetasks-api:candidate-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record and verify candidate image ID
        id: candidate
        run: |
          CANDIDATE_TAG="forgetasks-api:candidate-${{ github.run_id }}"
          CANDIDATE_ID=$(docker inspect --format='{{.Id}}' "$CANDIDATE_TAG")
          echo "candidate_id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"
          echo "============================================================"
          echo " CANDIDATE CONTAINER ARTIFACT BUILT ONCE"
          echo "============================================================"
          echo "Candidate Tag:  $CANDIDATE_TAG"
          echo "Candidate ID:   $CANDIDATE_ID"
          echo "Source Commit:  ${{ needs.validate-release.outputs.validated_sha }}"
          echo "Target Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Configured Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "============================================================"

      - name: Run Trivy security gate on candidate image (CRITICAL & HIGH block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: forgetasks-api:candidate-${{ github.run_id }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate Trivy SARIF report for candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: always()
        with:
          image-ref: forgetasks-api:candidate-${{ github.run_id }}
          format: sarif
          output: trivy-candidate.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload pre-publish SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-candidate.sarif
          category: trivy-candidate-image
        continue-on-error: true

      - name: Generate CycloneDX SBOM for candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: forgetasks-api:candidate-${{ github.run_id }}
          format: cyclonedx
          output: forgetasks-api-sbom.cdx.json

      - name: Upload candidate SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ needs.validate-release.outputs.short_sha }}
          path: forgetasks-api-sbom.cdx.json
          retention-days: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image to GHCR (zero rebuild)
        env:
          EXPECTED_ID: ${{ steps.candidate.outputs.candidate_id }}
          CANDIDATE_TAG: forgetasks-api:candidate-${{ github.run_id }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "=== Verifying Candidate Image Integrity Before Push ==="
          CURRENT_ID=$(docker inspect --format='{{.Id}}' "$CANDIDATE_TAG")
          if [ "$CURRENT_ID" != "$EXPECTED_ID" ]; then
            echo "::error::Image integrity failure! Expected image ID $EXPECTED_ID, but detected $CURRENT_ID before publishing."
            exit 1
          fi
          echo "[PASS] Image ID unchanged: $CURRENT_ID matches scanned candidate."

          echo "=== Publishing Verified Candidate to GHCR ==="
          for tag in $TAGS; do
            echo "Pushing: $tag"
            docker push "$tag"
          done
          echo "[PASS] All verified image tags pushed to GHCR."

      - name: Record and verify published image digest
        id: publish-digest
        env:
          PRIMARY_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.validate-release.outputs.short_sha }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Retrieve repo digests populated by docker push
          REPO_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$PRIMARY_TAG" | grep "^${REGISTRY_IMAGE}@" | head -n 1)

          if [ -z "$REPO_DIGEST" ]; then
            echo "::error::Could not determine published repository digest from Docker daemon."
            exit 1
          fi

          DIGEST=$(echo "$REPO_DIGEST" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "============================================================"
          echo " GHCR PUBLICATION VERIFIED"
          echo "============================================================"
          echo "Registry:          ${{ env.REGISTRY }}"
          echo "Image Name:        ${{ env.IMAGE_NAME }}"
          echo "Source Commit:     ${{ needs.validate-release.outputs.validated_sha }}"
          echo "Candidate ID:      ${{ steps.candidate.outputs.candidate_id }}"
          echo "Published Digest:  $DIGEST"
          echo "Canonical Ref:     ${REGISTRY_IMAGE}@${DIGEST}"
          echo "============================================================"
          echo ""
          echo "Immutable deployment reference for GitOps (Argo CD):"
          echo "  ${REGISTRY_IMAGE}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish-digest.outputs.digest }}
          push-to-registry: true
        continue-on-error: true