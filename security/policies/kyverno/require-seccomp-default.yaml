apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-default
  annotations:
    policies.kyverno.io/title: Require Seccomp RuntimeDefault
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Seccomp profiles restrict system calls and must be set to RuntimeDefault or Localhost.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-seccomp-profile
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Seccomp profile must be set to RuntimeDefault or Localhost."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault | Localhost
          - spec:
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault | Localhost

