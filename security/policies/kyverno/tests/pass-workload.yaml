apiVersion: v1
kind: Pod
metadata:
  name: pass-compliant-workload
  namespace: default
  labels:
    app.kubernetes.io/name: forgetasks-api
    app.kubernetes.io/instance: production
    forgeops.dev/security-tier: tier-1
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: forgetasks-api
      image: ghcr.io/tm-threemavithana/forgetasks:1.0.0
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

