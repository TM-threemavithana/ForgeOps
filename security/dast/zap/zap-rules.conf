# OWASP ZAP Baseline Scanning Rules Configuration for ForgeTasks REST API
# Format: <rule-id>\t<FAIL|WARN|IGNORE>\t<comment>
#
# Threat Model Rationale:
# - FAIL on high-risk missing security headers (CSP, Clickjacking, MIME-sniffing, Information disclosure).
# - IGNORE session/browser-cookie-specific rules (anti-CSRF tokens) because ForgeTasks is a stateless REST API using HTTP Basic & token headers.
# - IGNORE benign timestamp representations (RFC 7807 problem details specify ISO-8601/Unix timestamps intentionally).

# 10020: Anti-CSRF Tokens Check (Stateless API with stateless session policy)
10020	IGNORE	(Anti-CSRF Tokens Check - Stateless REST API)

# 10021: X-Content-Type-Options Header Missing
10021	FAIL	(X-Content-Type-Options Header Missing)

# 10023: Information Disclosure - Debug Error Pages
10023	FAIL	(Information Disclosure - Debug Error Pages)

# 10024: Information Disclosure - Sensitive Information in URL
10024	FAIL	(Information Disclosure - Sensitive Information in URL)

# 10025: Information Disclosure - Comments
10025	WARN	(Information Disclosure - Comments)

# 10027: Information Disclosure - Suspicious Comments
10027	WARN	(Information Disclosure - Suspicious Comments)

# 10037: Server Leaks Version Information via "Server" HTTP Response Header Field
10037	WARN	(Server Leaks Version Information)

# 10038: Content Security Policy (CSP) Header Not Set
10038	FAIL	(Content Security Policy (CSP) Header Not Set)

# 10049: Storable and Cacheable Content
10049	IGNORE	(Storable and Cacheable Content - API responses vary)

# 10055: CSP: Wildcard Directive
10055	FAIL	(CSP: Wildcard Directive)

# 10063: Permissions-Policy Header Not Set
10063	WARN	(Permissions-Policy Header Not Set)

# 10096: Timestamp Disclosure - Unix / RFC Timestamps in Problem Details
10096	IGNORE	(Timestamp Disclosure - ProblemDetail timestamp property)

# 10098: Cross-Domain Misconfiguration
10098	FAIL	(Cross-Domain Misconfiguration)

# 10109: Modern Web Browser XSS Protection
10109	WARN	(Modern Web Browser XSS Protection)

# 10202: Absence of Anti-clickjacking Header
10202	FAIL	(Absence of Anti-clickjacking Header)

# 90022: Application Error Disclosure
90022	FAIL	(Application Error Disclosure)
