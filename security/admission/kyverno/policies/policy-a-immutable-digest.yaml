apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-image-digest
  namespace: forgeops-g09-kyverno
  annotations:
    policies.kyverno.io/title: Require Immutable Image Digest
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: All container images must be referenced using immutable SHA-256 digests rather than mutable tags.
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
  validations:
    - expression: >-
        variables.podSpec.containers.all(c, c.image.contains('@sha256:')) &&
        (!has(variables.podSpec.initContainers) || variables.podSpec.initContainers == null || variables.podSpec.initContainers.all(c, c.image.contains('@sha256:'))) &&
        (!has(variables.podSpec.ephemeralContainers) || variables.podSpec.ephemeralContainers == null || variables.podSpec.ephemeralContainers.all(c, c.image.contains('@sha256:')))
      message: "An immutable image digest (@sha256:...) is required for all containers."
