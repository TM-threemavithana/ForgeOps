# ForgeOps Gate G08 — Isolated GitOps Rehearsal Values Profile
# Strictly targets the isolated 'forgeops-gitops-rehearsal' namespace.
# Configured for unique naming, dedicated credentials, and zero collision with G06.

environment: dev

nameOverride: "rehearsal"
fullnameOverride: "forgetasks-rehearsal"

api:
  replicaCount: 1
  image:
    repository: ghcr.io/tm-threemavithana/forgetasks-api
    tag: "1.0.0"
    digest: "sha256:0d2faee3fb0746be0557760a26118d5fa637609654028a7eaa573f09cbdca83b"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  extraEnv:
    - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
      value: "http://alloy.forgeops-observability.svc.cluster.local:4318/v1/traces"
    - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
      value: "1.0"
    - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
      value: "false"
    - name: MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED
      value: "false"

postgresql:
  enabled: true
  auth:
    existingSecretName: "forgetasks-rehearsal-db-secret"
    secretKeys:
      passwordKey: "postgres-password"
    database: "forgetasks"
    username: "forgeuser"
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

test:
  enabled: true
