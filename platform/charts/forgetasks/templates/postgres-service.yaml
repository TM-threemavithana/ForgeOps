{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgetasks.fullname" . }}-db-headless
  labels:
    {{- include "forgetasks.postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: {{ .Values.postgresql.service.port }}
  selector:
    {{- include "forgetasks.postgres.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgetasks.fullname" . }}-db
  labels:
    {{- include "forgetasks.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: {{ .Values.postgresql.service.port }}
      protocol: TCP
  selector:
    {{- include "forgetasks.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
