# ForgeOps Gate G06 — Kind Cluster Configuration
# Core Profile Single-Control-Plane Kubernetes v1.34.11
# Strict Local Loopback Binding (127.0.0.1) & Zero Host Network Exposure

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Strict loopback binding for Kubernetes API Server on host
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

# Single-control-plane topology (Core Profile)
# Avoids unnecessary worker node overhead (~600-800 MiB RAM saved)
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    labels:
      forgeops.dev/environment: lab
      forgeops.dev/profile: core
