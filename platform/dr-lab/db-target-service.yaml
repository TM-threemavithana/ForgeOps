apiVersion: v1
kind: Service
metadata:
  name: dr-target-db
  namespace: forgeops-dr-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: forgeops
    forgeops.dev/environment: dr-lab
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: dr-target-db
