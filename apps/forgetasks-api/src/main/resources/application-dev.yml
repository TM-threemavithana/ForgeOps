spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/forgetasks_dev
    username: dev_user
    password: dev_password
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.forgeops.forgetasks: DEBUG
